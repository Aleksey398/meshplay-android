# Modified by MeshPlay on 2026-10-30
name: MeshPlay CI

on:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meshplay-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Debug build + game-layer unit tests on every branch push / PR. The fdroid flavor needs no
  # Google Maps / Firebase / Datadog keys, so this runs on a stock ubuntu runner.
  build-debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
        with:
          cache_read_only: 'false'

      - name: Game layer unit tests
        run: |
          set +e
          ./gradlew :core:game-protocol:jvmTest :feature:games:jvmTest --console=plain 2>&1 | tee unit-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error:|FAILURE:|What went wrong|Could not |Unresolved reference|> .*FAILED" unit-tests.log | head -60 | sed 's/^/::error::/' || true
            grep -A4 "> .*FAILED" unit-tests.log | grep -E "Error|expected|actual|at org\.meshplay|Caused by" | head -40 | sed 's/^/::error::/' || true
          fi
          exit "$status"

      - name: Assemble fdroid debug APK
        run: |
          set +e
          ./gradlew :androidApp:assembleFdroidDebug --console=plain 2>&1 | tee assemble.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error:|FAILURE:|What went wrong|Could not |Unresolved reference|> .*FAILED" assemble.log | head -60 | sed 's/^/::error::/' || true
            grep -A4 "> .*FAILED" assemble.log | grep -E "Error|expected|actual|at org\.meshplay|Caused by" | head -40 | sed 's/^/::error::/' || true
          fi
          exit "$status"

      - name: Report debug APK
        run: |
          {
            echo "## Debug APK"
            echo
            echo "Download the artifact below to get the file(s):"
            echo
            ls -lh androidApp/build/outputs/apk/fdroid/debug/*.apk | awk '{print "- `" $9 "` (" $5 ")"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshPlay-debug-APK
          path: androidApp/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

  # Tagged release: assemble fdroidRelease, sign when the keystore secrets are configured, and
  # attach the APKs to a GitHub Release.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
        with:
          cache_read_only: 'false'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            {
              echo "storeFile=$PWD/keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Release keystore restored; APKs will be signed."
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set; producing unsigned release APKs."
          fi

      - name: Game layer unit tests
        run: ./gradlew :core:game-protocol:jvmTest :feature:games:jvmTest --console=plain

      - name: Assemble fdroid release APK
        run: ./gradlew :androidApp:assembleFdroidRelease

      # Publish the APK as a separate downloadable file on the release; never publish a release
      # that has no APK attached.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: androidApp/build/outputs/apk/fdroid/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
